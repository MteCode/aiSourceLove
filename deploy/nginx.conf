# 缘桥 Nginx 配置
# 由 deploy.sh 替换 __ROOT__ 和 __SERVER_NAME__ 后安装到 /etc/nginx/sites-available/yuanqiao

server {
    listen 80;
    listen [::]:80;
    server_name __SERVER_NAME__;

    # 上传的照片可能不小
    client_max_body_size 12m;

    # 压缩：JSON 接口和前端 bundle 都能省不少流量
    gzip on;
    gzip_min_length 1k;
    gzip_comp_level 5;
    gzip_types text/plain text/css application/json application/javascript
               application/x-javascript text/xml application/xml image/svg+xml;
    gzip_vary on;

    access_log /var/log/nginx/yuanqiao.access.log;
    error_log  /var/log/nginx/yuanqiao.error.log;

    # ── 后台管理系统（Vue3 SPA）──
    location / {
        root __ROOT__/apps/admin/dist;
        index index.html;
        # SPA 路由回退，刷新子路由不 404
        try_files $uri $uri/ /index.html;
    }

    # ── H5 端（uni-app 编译产物）──
    location /h5/ {
        alias __ROOT__/apps/client/dist/build/h5/;
        index index.html;
        try_files $uri $uri/ /h5/index.html;
    }

    # 带 hash 的静态资源可以长缓存
    location ~* \.(js|css|png|jpg|jpeg|gif|ico|svg|woff2?)$ {
        root __ROOT__/apps/admin/dist;
        expires 30d;
        add_header Cache-Control "public, immutable";
        # admin 里找不到就去 h5 里找
        try_files $uri __ROOT__/apps/client/dist/build/h5$uri =404;
    }

    # ── 用户上传的图片 ──
    # 交给 Nginx 发，不占 Node 的事件循环。
    # ^~ 不能少：正则 location 的优先级高于普通前缀 location，
    # 没有它的话 /uploads/xxx.jpg 会被上面那条按扩展名匹配的规则截走，去 admin/dist 里找，然后 404。
    location ^~ /uploads/ {
        alias __ROOT__/apps/server/uploads/;
        expires 7d;
        add_header Cache-Control "public";
        # 上传目录里绝不能执行脚本
        location ~ \.(php|jsp|py|sh|js)$ { deny all; }
    }

    # ── API ──
    location /api/ {
        proxy_pass http://127.0.0.1:3000;
        proxy_http_version 1.1;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        # 后端靠这个取真实客户端 IP（见 ClientIp 装饰器）
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Upgrade           $http_upgrade;
        proxy_set_header Connection        "upgrade";

        # AI 匹配那条接口可能要跑十几秒
        proxy_connect_timeout 10s;
        proxy_send_timeout    60s;
        # AI 推荐要等大模型出字，推理型模型单次就能吃掉二三十秒。
        # 默认 60s 会在后端还在正常工作时就把连接切了，前端看到的是空响应，很难查。
        proxy_read_timeout    120s;
        proxy_buffering off;
    }

    location /health {
        proxy_pass http://127.0.0.1:3000/health;
        access_log off;
    }

    # 基础安全头
    add_header X-Content-Type-Options nosniff;
    add_header X-Frame-Options SAMEORIGIN;
    add_header Referrer-Policy strict-origin-when-cross-origin;
}

# ── HTTPS ──
# 小程序上线**必须**是 https，且域名要在微信后台备案配置。
# 有域名后执行：
#   sudo apt install certbot python3-certbot-nginx
#   sudo certbot --nginx -d your-domain.com
# certbot 会自动改写上面的 server 块并加上证书与 80→443 跳转。
